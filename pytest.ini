[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=64
    --durations=10
    --maxfail=5
    --random-order
    --random-order-seed=42
    --html=reports/pytest-report.html
    --self-contained-html
    --json-report
    --json-report-file=reports/pytest-report.json
markers =
    unit: Unit tests
    integration: Integration tests
    performance: Performance tests
    benchmark: Benchmark tests
    slow: Slow running tests
    network: Tests that require network access
    openstack: Tests that require OpenStack environment
    maas: Tests that require MAAS environment
    security: Security-related tests
    memory: Memory usage tests
    timeout: Tests with timeout protection
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:requests
    ignore::UserWarning:urllib3
    ignore::UserWarning:pytest
    ignore::FutureWarning
