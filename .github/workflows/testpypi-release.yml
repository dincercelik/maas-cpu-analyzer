name: TestPyPI Release

on:
  push:
    tags:
      - "test-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release to TestPyPI (e.g., test-v1.0.0)"
        required: true
        type: string

env:
  PYTHON_VERSION: "3.9"

jobs:
  test:
    name: Test Before Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox tox-gh-actions

      - name: Run tests with tox
        run: tox
        env:
          TOXENV: py${{ matrix.python-version }}

  build-and-release:
    name: Build and Release to TestPyPI
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish to TestPyPI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/test-')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: TestPyPI Release ${{ github.ref_name }}
          body: |
            ## TestPyPI Release ${{ github.ref_name }}

            This is a test release published to TestPyPI for testing purposes.

            ## Installation from TestPyPI

            ```bash
            pip install --index-url https://test.pypi.org/simple/ maas-cpu-analyzer==${{ github.ref_name }}
            ```

            ## Verification

            ```bash
            maas-cpu-analyzer --version
            ```

            **Note**: This is a test release. For production use, install from the main PyPI repository.
          draft: false
          prerelease: true
          files: ./dist/*
